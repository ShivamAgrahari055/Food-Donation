<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>

<body>
<div class="top-bar">
<button id="logoutBtn" class="logout">Logout</button>

<h2 id="roleTitle"></h2>
</div>
<!-- Provider Section -->
<div id="providerBox" class="box" style="display:none">
  <h3 class="action-card">Add Food</h3>
  <input id="food_qty" placeholder="Food Quantity">
  <input id="food_phone" placeholder="Phone Number">
  <button id="addFoodBtn">Add Food</button>
</div >
<h1 class="box">Don't waste ...Give the Needy!</h1>
<!-- Receiver Section -->
<div id="receiverBox" style="display:none">
  
  <ul id="foodList"></ul>
</div>
 
<!-- Admin Section -->
<div id="adminBox" class="box" style="display:none">
  <h4>Admin Panel</h4>
</div>

<!-- Hungry Person Report -->
<div class="box" id="reportBox">
  <h3 class="action-card">Report Hungry Person</h3>
  <input id="note" placeholder="Description">
  <button id="reportHungry">Report</button>
</div>

<h2>🧾 Hungry People Reports</h2>
<div id="reportList">Loading...</div>

<h3>Live Map</h3>
<div id="map" style="height: 500px;"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Your JS (MODULES) -->
<script type="module" src="role.js"></script>
<script type="module" src="food.js"></script>
<script type="module" src="report.js"></script>
<script type="module" src="map.js"></script>
<script type="module" src="logout.js"></script>

</body>
</html>
